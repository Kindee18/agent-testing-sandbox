name: AI Agent Sandbox Testing Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sandbox-test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-east-1"

    services:
      localstack:
        image: localstack/localstack
        ports:
          - 4566:4566
        env:
          SERVICES: s3,ec2,iam,sts

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Check for AWS Credentials
        id: check_aws
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "AWS_MOCK_MODE=true" >> $GITHUB_ENV
            echo "AWS_ACCESS_KEY_ID=test" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=test" >> $GITHUB_ENV
            echo "Using LocalStack Mock Mode..."
          else
            echo "AWS_MOCK_MODE=false" >> $GITHUB_ENV
            echo "Using Real AWS Mode..."
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Install Host Dependencies (Mock Mode Only)
        if: env.AWS_MOCK_MODE == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install pytest pyyaml

      - name: Wait for LocalStack Readiness
        if: env.AWS_MOCK_MODE == 'true'
        timeout-minutes: 6
        run: |
          echo "Waiting for LocalStack gateway..."
          max_retries=60
          count=0
          until curl -s http://localhost:4566/_localstack/health | grep -qE '"s3": "(running|available)"' || [ $count -eq $max_retries ]; do
            sleep 5
            count=$((count + 1))
            if [ $((count % 6)) -eq 0 ]; then
              echo "Still waiting for LocalStack (Attempt $count/$max_retries)..."
              curl -s http://localhost:4566/_localstack/health || echo "Endpoint not responding yet"
            fi
          done
          if [ $count -eq $max_retries ]; then
            echo "LocalStack failed to become ready in time. Proceeding with caution..."
          else
            echo "LocalStack is ready!"
          fi

      - name: Terraform Init
        run: |
          if [ "${{ env.AWS_MOCK_MODE }}" == "true" ]; then
            python3 -c "import json; d={'variable': {'ami_id': {'default': 'ami-mock'}}, 'provider': {'aws': {'region': 'us-east-1', 'access_key': 'test', 'secret_key': 'test', 'skip_credentials_validation': True, 'skip_metadata_api_check': True, 'skip_requesting_account_id': True, 'endpoints': {'ec2': 'http://localhost:4566', 's3': 'http://localhost:4566', 'iam': 'http://localhost:4566', 'sts': 'http://localhost:4566'}}}} ; open('override.tf.json', 'w').write(json.dumps(d))"
          fi
          terraform init
        working-directory: terraform

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve
        working-directory: terraform

      - name: Extract Infrastructure Details
        id: outputs
        run: |
          echo "INSTANCE_IP=$(terraform output -raw instance_public_ip)" >> $GITHUB_ENV
          echo "S3_BUCKET=$(terraform output -raw s3_bucket_name)" >> $GITHUB_ENV
        working-directory: terraform

      - name: Setup SSH Key
        if: env.AWS_MOCK_MODE == 'false'
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Wait for Cloud-Init/Readiness
        run: sleep 120 # Real AWS instances need more time for Docker/Python install

      - name: Deploy and Run Agent Tests
        run: |
          if [ "${{ env.AWS_MOCK_MODE }}" == "true" ]; then
            echo "Running tests in Mock Mode (Bypassing SSH)..."
            bash scripts/run_tests.sh
          else
            echo "Deploying code to ${{ env.INSTANCE_IP }} via SSH..."
            ssh -o StrictHostKeyChecking=no ubuntu@${{ env.INSTANCE_IP }} "mkdir -p ~/app"
            scp -o StrictHostKeyChecking=no -r . ubuntu@${{ env.INSTANCE_IP }}:~/app/
            ssh -o StrictHostKeyChecking=no ubuntu@${{ env.INSTANCE_IP }} "cd ~/app && bash scripts/run_tests.sh"
          fi

      - name: Terraform Destroy (Cleanup)
        if: always()
        run: terraform destroy -auto-approve
        working-directory: terraform
